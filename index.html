<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
    <h1>Settings</h1>

    <form id="settingsForm" novalidate>

        <!-- Full Name -->
        <div class="form-group">
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                aria-describedby="nameError"
                required
            >

            <p
                id="nameError"
                class="error"
                role="alert"
            ></p>
        </div>


        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                aria-describedby="emailError"
                required
            >

            <p
                id="emailError"
                class="error"
                role="alert"
            ></p>
        </div>


        <!-- Password -->
        <div class="form-group">
            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                aria-describedby="passwordError"
            >

            <p
                id="passwordError"
                class="error"
                role="alert"
            ></p>
        </div>


        <!-- Notifications -->
        <div class="checkbox-group">

            <input
                type="checkbox"
                id="notifications"
                name="notifications"
            >

            <label for="notifications">
                Enable email notifications
            </label>

        </div>


        <button type="submit">
            Save Changes
        </button>


        <!-- Success / general message -->
        <p
            id="message"
            role="status"
            aria-live="polite"
        ></p>

    </form>

</main>

<script src="script.js"></script>

</body>
</html>
